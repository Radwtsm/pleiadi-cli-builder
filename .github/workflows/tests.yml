name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:  # ubuntu-latest (26.04) has no Python 3.9 build: old versions run on 22.04
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: tests
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          fail=0
          for t in tests/test_*.py examples/*/tests/test_*.py; do
            echo "::group::$t"
            python "$t" || { echo "::error::$t failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
      - name: secret scan
        shell: bash
        run: python -m pleiadi_cli_builder segreti $(git ls-files)
